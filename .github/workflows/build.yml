name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Unpack game.zip
        shell: bash
        run: |
          set -e

          mkdir -p game
          unzip -q game.zip -d game

          if [ -f "game/project.godot" ]; then
            GAME_DIR="game"
          else
            PROJECT_FILE=$(find game -type f -name "project.godot" | head -n 1)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: project.godot not found"
              find game -maxdepth 4 -type f | head -100
              exit 1
            fi

            GAME_DIR=$(dirname "$PROJECT_FILE")
          fi

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$GAME_DIR"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      - name: Start Android ADB
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "ADB location:"
          which adb

          echo "ADB version:"
          adb version

          echo "Starting ADB daemon..."
          adb start-server

          echo "Checking ADB:"
          adb devices


      - name: Download Godot 4.6
        shell: bash
        run: |
          set -e

          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"

          echo "Downloading Godot..."
          curl -fL "$GODOT_URL" -o godot.zip

          echo "Extracting Godot..."
          rm -rf godot-dist
          mkdir -p godot-dist

          unzip -q godot.zip -d godot-dist

          GODOT_BIN="godot-dist/Godot_v4.6-stable_linux.x86_64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            find godot-dist -maxdepth 2 -type f -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          cp "$GODOT_BIN" ./godot
          chmod +x ./godot

          echo "Godot version:"
          ./godot --version


      - name: Download Android export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"

          echo "Downloading Android export templates..."
          curl -fL "$TEMPLATE_URL" -o templates.tpz

          EXPORT_ROOT="$HOME/.local/share/godot/export_templates"
          TEMP_TEMPLATES="$EXPORT_ROOT/temp"

          rm -rf "$TEMP_TEMPLATES"
          mkdir -p "$TEMP_TEMPLATES"

          echo "Extracting TPZ..."
          unzip -q templates.tpz -d "$TEMP_TEMPLATES"

          rm -rf "$EXPORT_ROOT/4.6.stable"

          if [ -d "$TEMP_TEMPLATES/templates" ]; then
            mv "$TEMP_TEMPLATES/templates" "$EXPORT_ROOT/4.6.stable"
          else
            echo "ERROR: templates directory not found inside TPZ."
            find "$TEMP_TEMPLATES" -maxdepth 3 -type f
            exit 1
          fi

          rm -rf "$TEMP_TEMPLATES"

          echo "Export templates installed:"
          find "$EXPORT_ROOT/4.6.stable" -maxdepth 2 -type f | head -30


      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/sdk_path = "${ANDROID_HOME}"
          EOF

          echo "Godot Android paths:"
          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"
          echo "ADB: $ANDROID_HOME/platform-tools/adb"


      - name: Import Godot project
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          cd "$GAME_DIR"

          echo "Importing Godot project..."

          "$GITHUB_WORKSPACE/godot" \
            --headless \
            --editor \
            --quit \
            --path . \
            --import

          echo "Import completed."


      - name: Build Android APK
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "Checking ADB before export..."
          adb start-server
          adb devices

          cd "$GAME_DIR"

          mkdir -p build/android

          echo "Building Android APK..."

          "$GITHUB_WORKSPACE/godot" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/android/GaeaRunner.apk

          echo "APK created successfully!"

          ls -lh build/android/GaeaRunner.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaeaRunner-APK
          path: "${{ env.GAME_DIR }}/build/android/GaeaRunner.apk"
          if-no-files-found: error
