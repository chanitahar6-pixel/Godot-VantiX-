name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack game.zip
        shell: bash
        run: |
          set -e

          mkdir -p game
          unzip -q game.zip -d game

          if [ -f "game/project.godot" ]; then
            GAME_DIR="game"
          else
            PROJECT_FILE=$(find game -maxdepth 4 -type f -name "project.godot" | head -n 1)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: project.godot not found inside game.zip"
              find game -maxdepth 4 -type f | head -100
              exit 1
            fi

            GAME_DIR=$(dirname "$PROJECT_FILE")
          fi

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $GAME_DIR"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      - name: Download Godot 4.6
        shell: bash
        run: |
          set -e

          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"

          echo "Downloading Godot..."
          curl -fL "$GODOT_URL" -o godot.zip

          echo "Extracting Godot..."
          mkdir -p godot-dist
          unzip -q godot.zip -d godot-dist

          echo "Searching for Godot executable..."

          GODOT_BIN=$(find godot-dist -type f -name "godot" | head -n 1)

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable was not found."
            echo "Downloaded files:"
            find godot-dist -maxdepth 4 -type f
            exit 1
          fi

          echo "Found: $GODOT_BIN"

          chmod +x "$GODOT_BIN"
          cp "$GODOT_BIN" ./godot
          chmod +x ./godot

          echo "Godot version:"
          ./godot --version


      - name: Download Android export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"

          echo "Downloading export templates..."
          curl -fL "$TEMPLATE_URL" -o templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.stable"

          mkdir -p "$TEMPLATE_DIR"

          echo "Extracting templates..."
          tar -xf templates.tpz -C "$TEMPLATE_DIR"

          if [ -d "$TEMPLATE_DIR/templates" ]; then
            cp -r "$TEMPLATE_DIR/templates/." "$TEMPLATE_DIR/"
            rm -rf "$TEMPLATE_DIR/templates"
          fi

          echo "Export templates installed."


      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/sdk_path = "${ANDROID_HOME}"
          EOF

          echo "Godot Android paths configured."


      - name: Import Godot project
        shell: bash
        run: |
          set -e

          cd "$GAME_DIR"

          echo "Importing project..."

          "$GITHUB_WORKSPACE/godot" \
            --headless \
            --editor \
            --quit \
            --path . \
            --import

          echo "Import completed."


      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$GAME_DIR"

          mkdir -p build/android

          echo "Building APK..."

          "$GITHUB_WORKSPACE/godot" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/android/GaeaRunner.apk

          echo "APK build completed!"

          ls -lh build/android/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaeaRunner-APK
          path: "${{ env.GAME_DIR }}/build/android/GaeaRunner.apk"
          if-no-files-found: error
