name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.6
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.6-stable_linux.x86_64

      - name: Install Godot export templates
        run: |
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/4.6.stable"
          if [ -d "$HOME/.local/share/godot/export_templates/4.6.stable/templates" ]; then
            cp -a "$HOME/.local/share/godot/export_templates/4.6.stable/templates/." "$HOME/.local/share/godot/export_templates/4.6.stable/"
            rm -rf "$HOME/.local/share/godot/export_templates/4.6.stable/templates"
          fi

      - name: Configure Godot Android SDK path
        run: |
          "$GITHUB_WORKSPACE/godot-bin/Godot_v4.6-stable_linux.x86_64" --headless --editor --quit
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF2

      - name: Build APK
        run: |
          mkdir -p build/android
          "$GITHUB_WORKSPACE/godot-bin/Godot_v4.6-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/android/GaeaRunner.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaeaRunner-APK
          path: build/android/GaeaRunner.apk
          if-no-files-found: error
